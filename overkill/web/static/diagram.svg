<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 426" width="1000" height="426" role="img" aria-labelledby="dg-title dg-desc" class="dg dg-wide"><title id="dg-title">How a note gets our encryption, then each host's native encryption, on a dozen hosts</title><desc id="dg-desc">Your note exists in plaintext only in your browser or terminal. Our encryption comes first, on your device: age (X25519 and ChaCha20-Poly1305), then AES-256-GCM with keys derived by HKDF, in open-source code (crypto.js). Then copies go to independent hosts, each with its own native encryption: 3 PrivateBin instances (native AES-256-GCM, key in the link), 2 CryptPad instances (native XSalsa20-Poly1305), 4 Nostr relays (native NIP-44: ChaCha20 and HMAC-SHA256), and 3 Blossom servers, which have no native encryption, so we add an extra AES-256-GCM layer there: 12 copies. Opt-in: MEGA, Proton Drive, Filen and Fileverse, each with its own client-side encryption. Recovery: any one healthy copy plus your vault name and passphrase gives your note back.</desc><style>svg{background:#ffffff}.dg{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;}.dg-title{font-weight:700;font-size:15px;fill:#1b2430}.dg-sub,.dg-layer{font-size:11.5px;fill:#5b6b7a}.dg-hint{font-size:10.5px;fill:#0a8f4f}.dg-host-name{font-weight:700;font-size:13.5px;fill:#1b2430}.dg-count{font-weight:400;fill:#5b6b7a}.dg-total,.dg-return-text{font-size:12.5px;fill:#1b2430}.dg-total{font-weight:700}.dg-box{fill:#f4f7fa;stroke:#c9d3dd;stroke-width:1.5}.dg-note .dg-box{stroke-dasharray:5 4}.dg-box-ours{stroke:#0a8f4f;stroke-width:2}.dg-row{fill:#ffffff;stroke:#c9d3dd;stroke-width:1}.dg-optin{opacity:.72}.dg-optin .dg-row{stroke-dasharray:4 4}.dg-host-ours .dg-row{stroke:#9a6a00;stroke-dasharray:3 3}.dg-ours{fill:#9a6a00}.dg-tile{fill:#ffffff;stroke:#c9d3dd;stroke-width:1}.dg-badge{font-weight:700;fill:#1b2430}.dg-line{fill:none;stroke:#7b8a98;stroke-width:1.6}.dg-dashed{stroke-dasharray:5 4}.dg-return{stroke:#0a8f4f;stroke-dasharray:6 4}.dg-head{fill:#7b8a98}.dg-return-text{fill:#0a8f4f}.dg-packet{fill:#0a8f4f}@media (prefers-reduced-motion: reduce){.dg-packet{display:none}}@media (prefers-color-scheme: dark){svg{background:#0b0f14}.dg{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;}.dg-title{font-weight:700;font-size:15px;fill:#d9e4ee}.dg-sub,.dg-layer{font-size:11.5px;fill:#8aa0b4}.dg-hint{font-size:10.5px;fill:#39ff88}.dg-host-name{font-weight:700;font-size:13.5px;fill:#d9e4ee}.dg-count{font-weight:400;fill:#8aa0b4}.dg-total,.dg-return-text{font-size:12.5px;fill:#d9e4ee}.dg-total{font-weight:700}.dg-box{fill:#121922;stroke:#243241;stroke-width:1.5}.dg-note .dg-box{stroke-dasharray:5 4}.dg-box-ours{stroke:#39ff88;stroke-width:2}.dg-row{fill:#17212c;stroke:#243241;stroke-width:1}.dg-optin{opacity:.72}.dg-optin .dg-row{stroke-dasharray:4 4}.dg-host-ours .dg-row{stroke:#ffcf3f;stroke-dasharray:3 3}.dg-ours{fill:#ffcf3f}.dg-tile{fill:#ffffff;stroke:#243241;stroke-width:1}.dg-badge{font-weight:700;fill:#1b2430}.dg-line{fill:none;stroke:#8aa0b4;stroke-width:1.6}.dg-dashed{stroke-dasharray:5 4}.dg-return{stroke:#39ff88;stroke-dasharray:6 4}.dg-head{fill:#8aa0b4}.dg-return-text{fill:#39ff88}.dg-packet{fill:#39ff88}@media (prefers-reduced-motion: reduce){.dg-packet{display:none}}}</style><defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-head"/></marker></defs><g class="dg-step dg-note"><rect class="dg-box" x="6" y="155" width="184" height="90" rx="12"/><text class="dg-title" x="98" y="194" text-anchor="middle">Your note</text><text class="dg-sub" x="98" y="214" text-anchor="middle">plaintext, only on your device</text></g><g class="dg-step dg-ours-box" data-step="ours"><rect class="dg-box dg-box-ours" x="214" y="138" width="340" height="124" rx="12"/><text class="dg-title" x="384" y="166" text-anchor="middle">Our encryption</text><text class="dg-sub" x="384" y="188" text-anchor="middle">age (X25519 + ChaCha20-Poly1305)</text><text class="dg-sub" x="384" y="206" text-anchor="middle">AES-256-GCM (HKDF keys)</text><text class="dg-hint" x="384" y="226" text-anchor="middle">on your device · open source: crypto.js</text></g><path class="dg-line" d="M190 200H212" marker-end="url(#dg-arrow)"/><text class="dg-total" x="384" y="292" text-anchor="middle">3 PrivateBin + 2 CryptPad + 4 relays + 3 Blossom = 12 copies</text><text class="dg-total" x="640" y="22">Then each product's own (native) encryption</text><path class="dg-line" d="M554 200C600 200 600 64 638 64" marker-end="url(#dg-arrow)"/><g class="dg-host" data-host="privatebin"><rect class="dg-row" x="640" y="36" width="350" height="56" rx="10"/><rect class="dg-tile" x="648" y="44" width="40" height="40" rx="8"/><image class="dg-logo" data-logo="privatebin" href="data:image/svg+xml;base64," x="653" y="49" width="30" height="30" preserveAspectRatio="xMidYMid meet"/><text class="dg-host-name" x="698" y="60">PrivateBin <tspan class="dg-count">3 instances</tspan></text><text class="dg-layer" data-layer="privatebin" x="698" y="79">native: AES-256-GCM, key in the link</text></g><path class="dg-line" d="M554 200C600 200 600 130 638 130" marker-end="url(#dg-arrow)"/><g class="dg-host" data-host="cryptpad"><rect class="dg-row" x="640" y="102" width="350" height="56" rx="10"/><rect class="dg-tile" x="648" y="110" width="40" height="40" rx="8"/><image class="dg-logo" data-logo="cryptpad" href="data:image/svg+xml;base64," x="653" y="115" width="30" height="30" preserveAspectRatio="xMidYMid meet"/><text class="dg-host-name" x="698" y="126">CryptPad <tspan class="dg-count">2 instances</tspan></text><text class="dg-layer" data-layer="cryptpad" x="698" y="145">native: XSalsa20-Poly1305</text></g><path class="dg-line" d="M554 200C600 200 600 196 638 196" marker-end="url(#dg-arrow)"/><g class="dg-host" data-host="nostr"><rect class="dg-row" x="640" y="168" width="350" height="56" rx="10"/><rect class="dg-tile" x="648" y="176" width="40" height="40" rx="8"/><text class="dg-badge" data-badge="nostr" x="668" y="199.66666666666666" text-anchor="middle" font-size="11">Nostr</text><text class="dg-host-name" x="698" y="192">Nostr <tspan class="dg-count">4 relays</tspan></text><text class="dg-layer" data-layer="nostr" x="698" y="211">native NIP-44: ChaCha20 + HMAC-SHA256</text></g><path class="dg-line" d="M554 200C600 200 600 262 638 262" marker-end="url(#dg-arrow)"/><g class="dg-host dg-host-ours" data-host="blossom"><rect class="dg-row" x="640" y="234" width="350" height="56" rx="10"/><rect class="dg-tile" x="648" y="242" width="40" height="40" rx="8"/><text class="dg-badge" data-badge="blossom" x="668" y="265" text-anchor="middle" font-size="9">Blossom</text><text class="dg-host-name" x="698" y="258">Blossom <tspan class="dg-count">3 servers</tspan></text><text class="dg-layer dg-ours" data-layer="blossom" x="698" y="277">no native encryption; we add AES-256-GCM</text></g><path class="dg-line dg-dashed" d="M554 200C600 200 600 338 638 338" marker-end="url(#dg-arrow)"/><g class="dg-host dg-optin" data-host="optin"><rect class="dg-row" x="640" y="310" width="350" height="72" rx="10"/><rect class="dg-tile" x="648" y="318" width="40" height="40" rx="8"/><text class="dg-badge" data-badge="optin" x="668" y="341.6666666666667" text-anchor="middle" font-size="11">+4</text><text class="dg-host-name" x="698" y="334">Opt-in accounts</text><text class="dg-layer" x="698" y="352">MEGA, Proton Drive, Filen, Fileverse</text><text class="dg-layer" data-layer="optin" x="698" y="370">each service's own client-side encryption</text></g><path class="dg-line dg-return" d="M815 382V412H98V247" marker-end="url(#dg-arrow)"/><text class="dg-return-text" x="400" y="402" text-anchor="middle">recover: any one healthy copy + your vault name and passphrase = your note back</text><circle class="dg-packet" r="5" visibility="hidden"><set attributeName="visibility" to="visible" begin="0s"/><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M190 200H554"/></circle><circle class="dg-packet" r="5" visibility="hidden"><set attributeName="visibility" to="visible" begin="2.4s"/><animateMotion dur="2.4s" begin="2.4s" repeatCount="indefinite" path="M554 200C600 200 600 64 638 64"/></circle><circle class="dg-packet" r="5" visibility="hidden"><set attributeName="visibility" to="visible" begin="2.55s"/><animateMotion dur="2.4s" begin="2.55s" repeatCount="indefinite" path="M554 200C600 200 600 130 638 130"/></circle><circle class="dg-packet" r="5" visibility="hidden"><set attributeName="visibility" to="visible" begin="2.6999999999999997s"/><animateMotion dur="2.4s" begin="2.6999999999999997s" repeatCount="indefinite" path="M554 200C600 200 600 196 638 196"/></circle><circle class="dg-packet" r="5" visibility="hidden"><set attributeName="visibility" to="visible" begin="2.8499999999999996s"/><animateMotion dur="2.4s" begin="2.8499999999999996s" repeatCount="indefinite" path="M554 200C600 200 600 262 638 262"/></circle></svg>
