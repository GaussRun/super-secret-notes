name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install CLI dependencies (the web app imports the CLI's modules)
        working-directory: overkill/cli
        run: pnpm install --frozen-lockfile
      - name: Install web dependencies
        working-directory: overkill/web
        run: pnpm install --frozen-lockfile
      - name: Build static site
        working-directory: overkill/web
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: overkill/web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
